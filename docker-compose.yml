version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev --workspace backend"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_assistant
      JWT_SECRET: local-dev-secret
    ports:
      - '4000:4000'
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run frontend -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - '5173:5173'
    depends_on:
      - backend

volumes:
  postgres_data:
